; ResponsePrint ESP32-CAM firmware
; Default target: AI-Thinker ESP32-CAM (the most common board). This is a DEFAULT, not a
; guarantee: if your board differs, change CAMERA_MODEL_* below (see src/camera_pins.h).

[env:esp32cam]
platform = espressif32@^6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCAMERA_MODEL_AI_THINKER
    ; -DCAMERA_MODEL_WROVER_KIT   ; alternative pin map (use instead of the line above)
